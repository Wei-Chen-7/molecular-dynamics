[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-dynamics"
version = "0.1.0"
description = "Lennard-Jones molecular dynamics of a 2-D/3-D gas or liquid, in pure NumPy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wei Chen" }]
keywords = ["molecular-dynamics", "lennard-jones", "physics", "numpy", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["mdlj"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
